<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото на паспорт</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,500..600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #18160f; --ink-2: #241f15; --paper: #faf6ee; --line: #e3dcc8;
            --text: #231f16; --muted: #7c7361; --on-dark: #f4efe1; --accent: #b03a2e;
            --accent-light: #e2836f; --blue: #3a6ea5; --green: #3f7d57; --gold: #b9862e;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Archivo', sans-serif; background: radial-gradient(circle at 18% -10%, var(--ink-2), var(--ink) 62%); color: var(--on-dark); margin: 0; min-height: 100vh; padding: 40px 20px 120px; }
        .page { max-width: 980px; margin: 0 auto; }
        .masthead h1 { font-family: 'Fraunces', serif; font-style: italic; font-size: clamp(2.3rem, 5vw, 3.5rem); margin: 0; }
        .masthead p { color: var(--on-dark-muted); max-width: 500px; line-height: 1.5; }
        .status-pill { display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 8px 16px; font-size: 13px; margin: 20px 0; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; }
        .status-pill.active .status-dot { background: var(--blue); }
        .status-pill.success .status-dot { background: var(--green); }
        
        .studio { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 30px; align-items: start; }
        @media (max-width: 860px) { .studio { grid-template-columns: 1fr; } }
        
        .frame-panel, .control-panel { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 24px; color: var(--text); box-shadow: 0 30px 60px -30px rgba(0,0,0,.55); }
        
        .frame { width: 100%; aspect-ratio: 35/45; background: #fff; border: 1px solid var(--line); position: relative; overflow: hidden; border-radius: 6px; }
        .frame img, .frame video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .frame video { transform: scaleX(-1); }
        
        .guidelines { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
        .center-x { position: absolute; left: 50%; top: 0; height: 100%; border-left: 2px dashed rgba(176,58,46,.6); }
        .eyes-y { position: absolute; top: 45%; left: 0; width: 100%; border-top: 2px dashed rgba(58,110,165,.6); }
        .chin-y { position: absolute; top: 85%; left: 0; width: 100%; border-top: 2px dashed rgba(63,125,87,.6); }
        .hair-zone { position: absolute; top: 0; left: 0; width: 100%; height: 10%; border-bottom: 2px dashed rgba(185,134,46,.6); }
        
        /* Овал можно двигать мышкой или пальцем */
        #faceOval { position: absolute; top: 22%; left: 15%; width: 70%; height: 55%; border: 2px dashed rgba(176,58,46,.65); border-radius: 50%; cursor: move; touch-action: none; z-index: 20; }
        
        .controls { border-top: 1px solid var(--line); padding-top: 15px; margin-top: 15px; }
        .step-title { font-size: 13px; font-weight: 700; text-transform: uppercase; }
        .btn { border: none; border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--accent); color: var(--paper); }
        .btn-secondary { background: transparent; border: 1.5px solid var(--line); color: var(--text); }
        
        .link-actions { display: flex; gap: 10px; margin-top: 10px; }
        .link-actions button { flex: 1; }
        .hidden { display: none !important; }
        
        .capture-wrap { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; z-index: 1000; }
        #captureBtn { width: 90%; max-width: 350px; box-shadow: 0 8px 20px rgba(0,0,0,.4); pointer-events: auto; display: none; }
        body.camera-active #captureBtn { display: inline-flex; }
        @media (max-width: 700px) { body { padding: 20px 12px 140px; } }
    </style>
</head>
<body>
    <div class="page">
        <div class="masthead">
            <h1>Фото на паспорт<span style="color:var(--accent-light)">.</span></h1>
            <p>Смотрите на экран как в зеркало, поставьте лицо в овал и нажмите кнопку.</p>
        </div>
        
        <div class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="status">Готов к работе</span>
        </div>
        
        <div class="studio">
            <section class="frame-panel">
                <div class="frame" id="frame">
                    <img id="photo" alt="Фото">
                    <video id="camera" autoplay playsinline></video>
                    <div class="guidelines">
                        <div class="center-x"></div>
                        <div class="eyes-y"></div>
                        <div class="chin-y"></div>
                        <div class="hair-zone"></div>
                    </div>
                    <div id="faceOval"></div>
                </div>
                <div style="text-align:center; margin-top:15px; font-size:12px; color:var(--muted);">35 × 45 мм</div>
            </section>
            
            <section class="control-panel">
                <div class="controls">
                    <div class="step-title">1. Получите фото</div>
                    <button id="startCameraBtn" class="btn btn-primary" style="margin:10px 0;">Включить камеру</button>
                    <label for="fileInput" class="btn btn-secondary" style="display:inline-block;">Загрузить файл</label>
                    <input type="file" id="fileInput" accept="image/*" style="display:none;">
                </div>
                <div class="controls">
                    <div class="step-title">2. Сделайте снимок</div>
                    <p style="font-size:13px; color:var(--muted);">Нажмите кнопку внизу экрана.</p>
                </div>
                <div class="controls" id="resultControls" style="display: none;">
                    <div class="step-title">3. Сохраните результат</div>
                    <div class="link-actions">
                        <button id="downloadBtn" class="btn btn-primary">Скачать фото</button>
                    </div>
                    <div class="link-actions">
                        <button id="copyLinkBtn" class="btn btn-secondary">Скопировать ссылку</button>
                        <button id="resetBtn" class="btn btn-secondary" style="background: var(--paper-dim);">Новое фото</button>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <div class="capture-wrap">
        <button id="captureBtn" class="btn btn-primary" disabled>Сделать снимок</button>
    </div>

    <script>
        const frame = document.getElementById('frame');
        const photoImg = document.getElementById('photo');
        const video = document.getElementById('camera');
        const statusText = document.getElementById('status');
        const statusPill = document.getElementById('statusPill');
        const startBtn = document.getElementById('startCameraBtn');
        const captureBtn = document.getElementById('captureBtn');
        const fileInput = document.getElementById('fileInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyLinkBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultControls = document.getElementById('resultControls');
        const faceOval = document.getElementById('faceOval');
        const body = document.body;

        let cameraStream = null;
        let isCameraOn = false;
        let currentImageDataUrl = null;

        const canvas = document.createElement('canvas');
        canvas.width = 413;
        canvas.height = 531;
        const ctx = canvas.getContext('2d');

        // --- Логика перетаскивания овала (работает и мышкой, и пальцем) ---
        let isDragging = false;
        let startX, startY;

        faceOval.addEventListener('touchstart', startDrag, {passive: false});
        faceOval.addEventListener('mousedown', startDrag);
        document.addEventListener('touchmove', drag, {passive: false});
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchend', endDrag);
        document.addEventListener('mouseup', endDrag);

        function startDrag(e) {
            isDragging = true;
            startX = e.clientX - faceOval.offsetLeft;
            startY = e.clientY - faceOval.offsetTop;
            e.preventDefault();
        }
        function drag(e) {
            if (!isDragging) return;
            let x = e.clientX - startX;
            let y = e.clientY - startY;
            x = Math.max(0, Math.min(frame.clientWidth - faceOval.clientWidth, x));
            y = Math.max(0, Math.min(frame.clientHeight - faceOval.clientHeight, y));
            faceOval.style.left = x + 'px';
            faceOval.style.top = y + 'px';
        }
        function endDrag() { isDragging = false; }

        // --- Функция рисования (просто по центру, без смещений) ---
        function drawToCanvas(source) {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const srcW = source.videoWidth || source.naturalWidth || source.width;
            const srcH = source.videoHeight || source.naturalHeight || source.height;
            if (!srcW || !srcH) return;

            const srcRatio = srcW / srcH;
            const frameRatio = canvas.width / canvas.height;

            let drawWidth, drawHeight, drawX, drawY;
            if (srcRatio > frameRatio) {
                // Источник шире — обрезаем бока
                drawHeight = canvas.height;
                drawWidth = drawHeight * srcRatio;
                drawX = (canvas.width - drawWidth) / 2;
                drawY = 0;
            } else {
                // Источник выше — обрезаем верх/низ
                drawWidth = canvas.width;
                drawHeight = drawWidth / srcRatio;
                drawX = 0;
                drawY = (canvas.height - drawHeight) / 2;
            }
            ctx.drawImage(source, drawX, drawY, drawWidth, drawHeight);
        }

        function updatePhoto() {
            currentImageDataUrl = canvas.toDataURL('image/png');
            photoImg.src = currentImageDataUrl;
            photoImg.style.display = 'block';
            video.style.display = 'none';
            
            resultControls.style.display = 'block';
            downloadBtn.disabled = false;
            copyBtn.disabled = false;
            setStatus('success', 'Фото готово!');
        }

        function setStatus(type, text) {
            statusPill.className = 'status-pill ' + type;
            statusText.textContent = text;
        }

        // --- Камера ---
        startBtn.addEventListener('click', async () => {
            if (isCameraOn) { stopCamera(); return; }
            resultControls.style.display = 'none';
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = cameraStream;
                await video.play();
                video.style.display = 'block';
                photoImg.style.display = 'none';
                isCameraOn = true;
                captureBtn.disabled = false;
                body.classList.add('camera-active');
                startBtn.textContent = 'Выключить камеру';
                setStatus('active', 'Совместите лицо с овалом и линиями');
            } catch (e) {
                alert('Не удалось получить доступ к камере: ' + e.message);
            }
        });

        function stopCamera() {
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
            isCameraOn = false;
            video.style.display = 'none';
            captureBtn.disabled = true;
            body.classList.remove('camera-active');
            startBtn.textContent = 'Включить камеру';
        }

        captureBtn.addEventListener('click', () => {
            if (!isCameraOn) return;
            captureBtn.disabled = true;
            drawToCanvas(video);
            updatePhoto();
            stopCamera();
        });

        // --- Загрузка файла ---
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (isCameraOn) stopCamera();
            resultControls.style.display = 'none';
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    drawToCanvas(img);
                    updatePhoto();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            fileInput.value = '';
        });

        // --- Скачивание ---
        downloadBtn.addEventListener('click', () => {
            if (!currentImageDataUrl) return;
            const link = document.createElement('a');
            link.download = 'passport_photo.png';
            link.href = currentImageDataUrl;
            link.click();
        });

        // --- Копирование ссылки ---
        copyBtn.addEventListener('click', async () => {
            if (!currentImageDataUrl) return;
            try { 
                await navigator.clipboard.writeText(currentImageDataUrl); 
                setStatus('success', 'Ссылка скопирована!'); 
            } catch(e) { 
                alert('Не удалось скопировать ссылку автоматически'); 
            }
        });

        // --- Сброс и новое фото ---
        resetBtn.addEventListener('click', () => {
            resultControls.style.display = 'none';
            currentImageDataUrl = null;
            photoImg.style.display = 'none';
            setStatus('idle', 'Готов к работе');
        });
    </script>
</body>
</html>
